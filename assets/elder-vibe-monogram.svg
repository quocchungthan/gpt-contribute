<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="beardCurvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="monogramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="60" fill="#0b0f19" />
  
  <!-- Outer Neon Ring (Interlocking Code Hexagon / Circle) -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#monoGrad)" stroke-width="8" filter="url(#monogramGlow)"/>
  
  <g transform="translate(250, 240)">

    <!-- Stylized White Curly Hair Cloud top element -->
    <path d="M -100 -80 
             C -120 -120, -70 -160, -30 -140 
             C 0 -170, 50 -160, 60 -130 
             C 100 -150, 130 -110, 100 -70 
             C 60 -80, -60 -80, -100 -80 Z" 
          fill="url(#beardCurvGrad)" />

    <!-- Sleek Neon Shades Frame (Centerpiece) -->
    <path d="M -90 -60 L 90 -60 L 75 0 Q 0 20 -75 0 Z" fill="#0f172a" stroke="url(#monoGrad)" stroke-width="6" filter="url(#monogramGlow)"/>
    
    <!-- Code Brackets inside Lenses: < E | V > -->
    <!-- Left Bracket < -->
    <path d="M -60 -35 L -80 -30 L -60 -25" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right Bracket > -->
    <path d="M 60 -35 L 80 -30 L 60 -25" stroke="#9d4edd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Monogram E & V interlocking shape inside sunglasses lenses -->
    <!-- Letter E in left lens -->
    <path d="M -45 -42 H -20 M -45 -30 H -25 M -45 -18 H -20 M -45 -42 V -18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Letter V in right lens -->
    <path d="M 20 -42 L 32.5 -18 L 45 -42" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylized Curled White Beard Base forming V-Shape Angle -->
    <path d="M -85 20 
             C -110 90, -50 160, 0 175 
             C 50 160, 110 90, 85 20 
             C 65 60, 40 100, 0 110 
             C -40 100, -65 60, -85 20 Z" 
          fill="url(#beardCurvGrad)" filter="url(#monogramGlow)"/>

    <!-- Swirl Curls inside beard -->
    <path d="M -35 80 C -20 110, 0 110, 0 90" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 35 80 C 20 110, 0 110, 0 90" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  </g>

  <!-- Tagline Monospace -->
  <text x="250" y="445" fill="#00f2fe" font-family="'Courier New', monospace" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">&lt;ELDER_VIBE/&gt;</text>
</svg>
