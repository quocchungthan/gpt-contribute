<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 08: Pop Art - Ben-Day halftone dot pattern, bold comic black outlines & primary colors -->
  <defs>
    <pattern id="popDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="4" fill="#ef4444"/>
    </pattern>
  </defs>

  <rect width="500" height="500" rx="30" fill="#facc15"/>

  <!-- Halftone Dot Overlay Circle -->
  <circle cx="250" cy="250" r="210" fill="url(#popDots)" stroke="#000000" stroke-width="8"/>

  <!-- Comic Burst Star Behind Head -->
  <polygon points="250,30 280,100 350,50 340,120 420,110 370,170 440,210 370,240 420,300 340,300 350,370 280,330 250,410 220,330 150,370 160,300 80,300 130,240 60,210 130,170 80,110 160,120 150,50 220,100" 
           fill="#2563eb" stroke="#000000" stroke-width="6"/>

  <g transform="translate(0, 10)">
    <!-- Bold White Hair Curls -->
    <g fill="#ffffff" stroke="#000000" stroke-width="6">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
    </g>

    <!-- Face Base -->
    <path d="M 160 180 C 160 280, 340 280, 340 180 Z" fill="#ffedd5" stroke="#000000" stroke-width="6"/>

    <!-- Bold Pop Art Glasses -->
    <rect x="145" y="175" width="210" height="50" rx="10" fill="#000000"/>
    <rect x="155" y="183" width="85" height="34" rx="4" fill="#ef4444"/>
    <rect x="260" y="183" width="85" height="34" rx="4" fill="#ef4444"/>

    <!-- Bold Beard -->
    <path d="M 155 240 C 130 280, 135 370, 180 395 C 210 415, 290 415, 320 395 C 365 370, 370 280, 345 240 C 330 285, 305 315, 250 320 C 195 315, 170 285, 155 240 Z" 
          fill="#ffffff" stroke="#000000" stroke-width="6"/>
  </g>

  <!-- Comic Speech / Sound Effect Bubble -->
  <path d="M 320 340 L 440 320 L 410 380 L 370 370 Z" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <rect x="330" y="315" width="130" height="40" rx="20" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <text x="395" y="340" fill="#000000" font-family="Impact, sans-serif" font-size="20" font-weight="900" text-anchor="middle">VIBE!</text>
</svg>
