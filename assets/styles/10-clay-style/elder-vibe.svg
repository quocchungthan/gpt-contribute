<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 10: Claymorphism - Soft rounded 3D clay aesthetic, inner & outer smooth drop shadows -->
  <defs>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="30" fill="#e0e7ff"/>

  <!-- Background Clay Badge Card -->
  <rect x="50" y="50" width="400" height="400" rx="40" fill="#f1f5f9" filter="url(#clayShadow)"/>

  <g transform="translate(0, 15)">
    <!-- 3D Clay Hair Curls (Soft Rounded White Clay) -->
    <g fill="#ffffff" filter="url(#clayShadow)">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
    </g>

    <!-- Clay Headphone -->
    <rect x="100" y="170" width="34" height="70" rx="17" fill="#818cf8" filter="url(#clayShadow)"/>
    <rect x="366" y="170" width="34" height="70" rx="17" fill="#818cf8" filter="url(#clayShadow)"/>

    <!-- Clay Face -->
    <path d="M 160 180 C 160 280, 340 280, 340 180 Z" fill="#ffedd5" filter="url(#clayShadow)"/>

    <!-- Soft 3D Clay Sunglasses -->
    <rect x="150" y="175" width="200" height="48" rx="16" fill="#312e81" filter="url(#clayShadow)"/>
    <rect x="162" y="183" width="80" height="32" rx="10" fill="#4f46e5"/>
    <rect x="258" y="183" width="80" height="32" rx="10" fill="#4f46e5"/>

    <!-- Soft 3D Clay Beard -->
    <path d="M 155 240 C 130 280, 135 370, 180 395 C 210 415, 290 415, 320 395 C 365 370, 370 280, 345 240 C 330 285, 305 315, 250 320 C 195 315, 170 285, 155 240 Z" 
          fill="#ffffff" filter="url(#clayShadow)"/>
  </g>

  <rect x="140" y="420" width="220" height="36" rx="18" fill="#818cf8" filter="url(#clayShadow)"/>
  <text x="250" y="443" fill="#ffffff" font-family="'Courier New', monospace" font-size="14" font-weight="900" text-anchor="middle">CLAY STYLE • VIBE</text>
</svg>
