<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 11: Pixel Art - 8-Bit / 16-Bit retro arcade pixel grid artwork -->
  <rect width="500" height="500" rx="30" fill="#0f172a"/>

  <!-- Pixel Grid Art (scaled up pixel blocks 10x10) -->
  <g fill="#ffffff">
    <!-- Pixel Hair -->
    <rect x="180" y="80" width="140" height="20"/>
    <rect x="140" y="100" width="220" height="20"/>
    <rect x="120" y="120" width="260" height="30"/>
    <rect x="100" y="150" width="50" height="40"/>
    <rect x="350" y="150" width="50" height="40"/>
  </g>

  <!-- Pixel Face (Skin Tone) -->
  <rect x="150" y="180" width="200" height="80" fill="#ffedd5"/>

  <!-- Pixel Sunglasses -->
  <g fill="#000000">
    <rect x="140" y="180" width="220" height="40"/>
  </g>
  <g fill="#00f2fe">
    <rect x="160" y="190" width="80" height="20"/>
    <rect x="260" y="190" width="80" height="20"/>
  </g>
  <!-- Pixel Reflection -->
  <rect x="170" y="190" width="20" height="10" fill="#ffffff"/>
  <rect x="270" y="190" width="20" height="10" fill="#ffffff"/>

  <!-- Pixel White Beard -->
  <g fill="#ffffff">
    <rect x="140" y="260" width="220" height="30"/>
    <rect x="160" y="290" width="180" height="40"/>
    <rect x="180" y="330" width="140" height="40"/>
    <rect x="200" y="370" width="100" height="30"/>
    <rect x="230" y="400" width="40" height="20"/>
  </g>

  <!-- Pixel Code Text -->
  <g fill="#39d353" font-family="monospace" font-size="14" font-weight="bold">
    <text x="250" y="460" text-anchor="middle">&lt;8BIT_ELDER_VIBE/&gt;</text>
  </g>
</svg>
