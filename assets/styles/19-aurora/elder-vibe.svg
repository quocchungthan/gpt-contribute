<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 19: Aurora - Flowing Northern Lights mesh gradient, ethereal glow & vibrant emerald/violet atmosphere -->
  <defs>
    <linearGradient id="auroraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#006466"/>
      <stop offset="100%" stop-color="#2b2d42"/>
    </linearGradient>

    <linearGradient id="auroraMesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="50%" stop-color="#118ab2"/>
      <stop offset="100%" stop-color="#073b4c"/>
    </linearGradient>

    <filter id="auroraGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="30" fill="url(#auroraBg)"/>

  <!-- Flowing Aurora Waves -->
  <path d="M 0 100 Q 150 50 300 150 T 500 100 L 500 300 Q 350 250 200 350 T 0 300 Z" fill="url(#auroraMesh)" opacity="0.5" filter="url(#auroraGlow)"/>

  <g transform="translate(0, 10)">
    <!-- White Ethereal Curled Hair -->
    <g fill="#ffffff" opacity="0.95" filter="url(#auroraGlow)">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
    </g>

    <!-- Aurora Visor -->
    <rect x="150" y="175" width="200" height="48" rx="12" fill="#051923" stroke="#06d6a0" stroke-width="3" filter="url(#auroraGlow)"/>
    <text x="250" y="204" fill="#06d6a0" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">AURORA • VIBE</text>

    <!-- Ethereal Beard -->
    <path d="M 155 240 C 130 280, 135 370, 180 395 C 210 415, 290 415, 320 395 C 365 370, 370 280, 345 240 C 330 285, 305 315, 250 320 C 195 315, 170 285, 155 240 Z" 
          fill="#ffffff" opacity="0.9" filter="url(#auroraGlow)"/>
  </g>

  <text x="250" y="460" fill="#06d6a0" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">AURORA LIGHTS • ELDER VIBE</text>
</svg>
