<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 09: Glassmorphism - Translucent frosted glass layers, soft ambient glows & white translucent stroke borders -->
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="30" fill="url(#glassBg)"/>

  <!-- Ambient Light Orbs behind glass -->
  <circle cx="150" cy="150" r="100" fill="#ff007f" opacity="0.6" filter="url(#glassBlur)"/>
  <circle cx="350" cy="350" r="120" fill="#00f2fe" opacity="0.6" filter="url(#glassBlur)"/>

  <!-- Glass Card Frame -->
  <rect x="50" y="50" width="400" height="400" rx="30" 
        fill="url(#glassCardGrad)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" />

  <g transform="translate(0, 10)">
    <!-- White Frosted Hair -->
    <g fill="rgba(255, 255, 255, 0.85)" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
    </g>

    <!-- Translucent Glass Visor Glasses -->
    <rect x="150" y="175" width="200" height="50" rx="15" 
          fill="rgba(0, 242, 254, 0.25)" 
          stroke="rgba(255, 255, 255, 0.8)" 
          stroke-width="2"/>
    <text x="250" y="205" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">GLASS • VIBE</text>

    <!-- Frosted Glass Beard -->
    <path d="M 155 240 C 130 280, 135 370, 180 395 C 210 415, 290 415, 320 395 C 365 370, 370 280, 345 240 C 330 285, 305 315, 250 320 C 195 315, 170 285, 155 240 Z" 
          fill="rgba(255, 255, 255, 0.85)" 
          stroke="rgba(255, 255, 255, 0.6)" 
          stroke-width="2"/>
  </g>

  <text x="250" y="460" fill="rgba(255, 255, 255, 0.9)" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">GLASSMORPHISM // ELDER VIBE</text>
</svg>
