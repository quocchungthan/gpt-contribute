<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 17: Victorian Engraving - Vintage woodcut style, ornate filigree frame, dark ink hatching lines on parchment -->
  <rect width="500" height="500" rx="30" fill="#f4ebd9"/>

  <!-- Ornate Victorian Filigree Border Frame -->
  <rect x="25" y="25" width="450" height="450" fill="none" stroke="#2c1d11" stroke-width="4"/>
  <rect x="33" y="33" width="434" height="434" fill="none" stroke="#8c6d53" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Victorian Corner Flourishes -->
  <path d="M 35 70 Q 70 70 70 35 M 465 70 Q 430 70 430 35 M 35 430 Q 70 430 70 465 M 465 430 Q 430 430 430 465" 
        fill="none" stroke="#2c1d11" stroke-width="3"/>

  <!-- Victorian Banner Ribbon Header -->
  <path d="M 80 80 Q 250 50 420 80 L 400 115 Q 250 90 100 115 Z" fill="#2c1d11"/>
  <text x="250" y="100" fill="#f4ebd9" font-family="'Times New Roman', Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">ELDER VIBE CODER</text>

  <!-- Victorian Portrait Line Engraving -->
  <g transform="translate(0, 35)">
    <!-- Engraved Curly Hair (Intricate Hatching) -->
    <g fill="none" stroke="#2c1d11" stroke-width="2">
      <circle cx="170" cy="140" r="38"/>
      <circle cx="210" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="290" cy="110" r="42"/>
      <circle cx="330" cy="140" r="38"/>
      <!-- Hatching lines -->
      <line x1="150" y1="130" x2="190" y2="150"/>
      <line x1="230" y1="90" x2="270" y2="110"/>
    </g>

    <!-- Victorian Spectacles / Monocle Glasses -->
    <circle cx="195" cy="180" r="28" fill="none" stroke="#2c1d11" stroke-width="3"/>
    <circle cx="305" cy="180" r="28" fill="none" stroke="#2c1d11" stroke-width="3"/>
    <line x1="223" y1="180" x2="277" y2="180" stroke="#2c1d11" stroke-width="3"/>
    <!-- Spectacle Chain -->
    <path d="M 333 180 Q 360 250 320 280" fill="none" stroke="#8c6d53" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Engraved Full White Beard -->
    <path d="M 155 220 C 130 270, 140 350, 185 375 C 215 395, 285 395, 315 375 C 360 350, 370 270, 345 220 C 330 270, 305 300, 250 305 C 195 300, 170 270, 155 220 Z" 
          fill="#f4ebd9" stroke="#2c1d11" stroke-width="2.5"/>
    <path d="M 210 320 Q 250 360 290 320" fill="none" stroke="#2c1d11" stroke-width="1.5"/>
  </g>

  <text x="250" y="450" fill="#2c1d11" font-family="'Times New Roman', Georgia, serif" font-size="14" font-style="italic" text-anchor="middle">EST. IN THE YEAR OF VIBE 2026</text>
</svg>
