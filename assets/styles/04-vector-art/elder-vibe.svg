<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 04: Vector Art - Crisp flat vectors, smooth curves, vibrant spot colors & clean dark outlines -->
  <rect width="500" height="500" rx="30" fill="#1e1b4b"/>
  <circle cx="250" cy="250" r="210" fill="#312e81"/>

  <g transform="translate(0, 10)">
    <!-- Hoodie -->
    <path d="M 120 450 C 120 350, 150 320, 250 320 C 350 320, 380 350, 380 450 Z" fill="#4338ca" stroke="#1e1b4b" stroke-width="4"/>

    <!-- White Curled Hair (Flat Vector Layers) -->
    <g fill="#f8fafc" stroke="#1e1b4b" stroke-width="4">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
      <circle cx="180" cy="160" r="30"/>
      <circle cx="320" cy="160" r="30"/>
    </g>

    <!-- Headphones -->
    <rect x="110" y="170" width="30" height="65" rx="15" fill="#f43f5e" stroke="#1e1b4b" stroke-width="4"/>
    <rect x="360" y="170" width="30" height="65" rx="15" fill="#f43f5e" stroke="#1e1b4b" stroke-width="4"/>
    <path d="M 130 190 C 130 80, 370 80, 370 190" fill="none" stroke="#f43f5e" stroke-width="16"/>

    <!-- Face Base -->
    <path d="M 160 180 C 160 280, 340 280, 340 180 Z" fill="#fed7aa" stroke="#1e1b4b" stroke-width="4"/>

    <!-- Vector Sunglasses -->
    <rect x="155" y="180" width="190" height="50" rx="12" fill="#0284c7" stroke="#1e1b4b" stroke-width="4"/>
    <rect x="165" y="188" width="75" height="34" rx="6" fill="#38bdf8"/>
    <rect x="260" y="188" width="75" height="34" rx="6" fill="#38bdf8"/>

    <!-- Full Vector Beard -->
    <path d="M 155 240 C 130 280, 135 370, 180 395 C 210 415, 290 415, 320 395 C 365 370, 370 280, 345 240 C 330 285, 305 315, 250 320 C 195 315, 170 285, 155 240 Z" 
          fill="#f8fafc" stroke="#1e1b4b" stroke-width="4"/>

    <!-- Mustache -->
    <path d="M 250 250 C 220 240, 175 250, 165 270 C 195 280, 230 275, 250 265 C 270 275, 305 280, 335 270 C 325 250, 280 240, 250 250 Z"
          fill="#e2e8f0" stroke="#1e1b4b" stroke-width="3"/>
  </g>
</svg>
