<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 06: Retro Synthwave / Outrun - 80s neon grid horizon, retro sunset & chrome text -->
  <defs>
    <linearGradient id="retroSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="30" fill="#0f051d"/>

  <!-- 80s Retro Sun -->
  <circle cx="250" cy="220" r="140" fill="url(#retroSun)"/>
  <!-- Sun stripes -->
  <rect x="100" y="210" width="300" height="6" fill="#0f051d"/>
  <rect x="100" y="225" width="300" height="10" fill="#0f051d"/>
  <rect x="100" y="245" width="300" height="14" fill="#0f051d"/>
  <rect x="100" y="270" width="300" height="20" fill="#0f051d"/>

  <!-- Perspective Grid Horizon -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.8">
    <line x1="0" y1="320" x2="500" y2="320"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="0" y1="390" x2="500" y2="390"/>
    <line x1="0" y1="440" x2="500" y2="440"/>
    <!-- Vanishing Lines -->
    <line x1="250" y1="300" x2="-100" y2="500"/>
    <line x1="250" y1="300" x2="50" y2="500"/>
    <line x1="250" y1="300" x2="180" y2="500"/>
    <line x1="250" y1="300" x2="250" y2="500"/>
    <line x1="250" y1="300" x2="320" y2="500"/>
    <line x1="250" y1="300" x2="450" y2="500"/>
    <line x1="250" y1="300" x2="600" y2="500"/>
  </g>

  <!-- Retro Character -->
  <g transform="translate(0, 10)">
    <!-- White Curly Hair -->
    <g fill="#ffffff">
      <circle cx="170" cy="140" r="36"/>
      <circle cx="210" cy="115" r="40"/>
      <circle cx="250" cy="100" r="44"/>
      <circle cx="290" cy="115" r="40"/>
      <circle cx="330" cy="140" r="36"/>
    </g>

    <!-- Chrome Retro Shades -->
    <path d="M 140 170 Q 250 160 360 170 L 340 225 Q 250 240 160 225 Z" fill="#090d16" stroke="#f43f5e" stroke-width="4"/>
    <path d="M 155 178 L 240 178 L 230 220 Q 195 228 165 220 Z" fill="#06b6d4"/>
    <path d="M 260 178 L 345 178 L 335 220 Q 305 228 270 220 Z" fill="#06b6d4"/>

    <!-- Retro Curled White Beard -->
    <path d="M 155 230 C 130 270, 140 350, 185 375 C 215 395, 285 395, 315 375 C 360 350, 370 270, 345 230 C 330 280, 305 310, 250 315 C 195 310, 170 280, 155 230 Z" fill="#ffffff"/>
  </g>

  <text x="250" y="470" fill="#f43f5e" font-family="'Courier New', monospace" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="4">RETRO 80S • VIBE</text>
</svg>
