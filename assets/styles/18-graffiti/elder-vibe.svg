<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 18: Graffiti - Urban spray paint art, wildstyle text, neon drips & brick texture -->
  <rect width="500" height="500" rx="30" fill="#171717"/>

  <!-- Brick Wall Texture Lines -->
  <g stroke="#262626" stroke-width="2">
    <line x1="0" y1="80" x2="500" y2="80"/>
    <line x1="0" y1="160" x2="500" y2="160"/>
    <line x1="0" y1="240" x2="500" y2="240"/>
    <line x1="0" y1="320" x2="500" y2="320"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
  </g>

  <!-- Neon Spray Splatters -->
  <circle cx="90" cy="90" r="40" fill="#a855f7" opacity="0.3"/>
  <circle cx="410" cy="110" r="50" fill="#22c55e" opacity="0.3"/>
  <circle cx="80" cy="400" r="45" fill="#ec4899" opacity="0.3"/>

  <!-- Graffiti Character -->
  <g transform="translate(0, 10)">
    <!-- White Spray Hair Curls -->
    <g fill="#ffffff" stroke="#000000" stroke-width="5">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
    </g>

    <!-- Wildstyle Sunglasses -->
    <path d="M 140 170 L 360 160 L 340 230 L 160 235 Z" fill="#ec4899" stroke="#000000" stroke-width="6"/>
    <text x="180" y="210" fill="#a3e635" font-family="Impact, sans-serif" font-size="24" font-weight="900" transform="rotate(-3 250 200)">VIBE</text>

    <!-- Drip Paint Drops from Glasses -->
    <path d="M 170 235 L 170 260 L 175 260 L 175 235 Z" fill="#ec4899"/>
    <path d="M 320 230 L 320 270 L 325 270 L 325 230 Z" fill="#ec4899"/>

    <!-- Spray Painted White Beard -->
    <path d="M 155 240 C 130 280, 135 370, 180 395 C 210 415, 290 415, 320 395 C 365 370, 370 280, 345 240 C 330 285, 305 315, 250 320 C 195 315, 170 285, 155 240 Z" 
          fill="#ffffff" stroke="#000000" stroke-width="6"/>
  </g>

  <!-- Graffiti Stencil Banner -->
  <polygon points="100,430 400,410 390,470 90,480" fill="#a3e635" stroke="#000000" stroke-width="5"/>
  <text x="250" y="458" fill="#000000" font-family="Impact, sans-serif" font-size="24" font-weight="900" text-anchor="middle" transform="rotate(-3 250 450)">GRAFFITI • ELDER VIBE</text>
</svg>
