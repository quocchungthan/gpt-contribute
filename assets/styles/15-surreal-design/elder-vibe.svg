<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 15: Surreal Design - Dreamlike Salvador Dali meets code, melting visors & floating elements -->
  <defs>
    <radialGradient id="surrealSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" rx="30" fill="url(#surrealSky)"/>

  <!-- Surreal Floating Eyeball / Spheres -->
  <circle cx="90" cy="120" r="25" fill="#fef08a" stroke="#a855f7" stroke-width="2"/>
  <circle cx="90" cy="120" r="10" fill="#090d16"/>
  <circle cx="410" cy="140" r="35" fill="#38bdf8" opacity="0.7"/>

  <!-- Surreal Melting Code Clock / Tree growing out of Hair -->
  <g transform="translate(0, 10)">
    <!-- Cloud / Tree White Hair -->
    <g fill="#ffffff" stroke="#a855f7" stroke-width="2">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
    </g>
    <!-- Code Branch Sprouting -->
    <path d="M 250 95 Q 260 40 300 30 M 265 60 Q 230 40 220 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="300" cy="30" r="6" fill="#fef08a"/>
    <circle cx="220" cy="20" r="5" fill="#fef08a"/>

    <!-- Surreal Melting Glasses (Dali style clock drip) -->
    <path d="M 140 170 Q 250 160 360 170 C 360 210, 340 260, 310 270 C 280 280, 260 220, 240 220 C 220 220, 200 280, 170 270 C 140 260, 140 210, 140 170 Z" 
          fill="#090d16" stroke="#38bdf8" stroke-width="4"/>
    <text x="180" y="210" fill="#38bdf8" font-family="monospace" font-size="14">DREAM</text>
    <text x="280" y="210" fill="#fef08a" font-family="monospace" font-size="14">CODE</text>

    <!-- Floating Melting Beard -->
    <path d="M 155 250 C 130 290, 120 370, 170 410 C 210 430, 290 430, 330 410 C 380 370, 370 290, 345 250 C 320 320, 180 320, 155 250 Z" 
          fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  </g>

  <text x="250" y="465" fill="#fef08a" font-family="'Courier New', monospace" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="3">SURREALISM • ELDER VIBE</text>
</svg>
