<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 01: Minimalism - Ultra-clean negative space & crisp geometric lines -->
  <rect width="500" height="500" rx="30" fill="#0f172a"/>
  
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Frame border -->
    <rect x="25" y="25" width="450" height="450" rx="20" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Minimalist Hair Curls (Geometric Arcs) -->
    <path d="M 170 140 A 30 30 0 0 1 230 130 A 35 35 0 0 1 300 130 A 30 30 0 0 1 340 160" stroke="#ffffff" stroke-width="6"/>
    <circle cx="210" cy="115" r="18" stroke="#ffffff" stroke-width="4"/>
    <circle cx="250" cy="100" r="22" stroke="#ffffff" stroke-width="4"/>
    <circle cx="290" cy="115" r="18" stroke="#ffffff" stroke-width="4"/>

    <!-- Minimalist Sunglasses -->
    <rect x="150" y="175" width="200" height="45" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
    <line x1="250" y1="175" x2="250" y2="220" stroke="#38bdf8" stroke-width="4"/>
    <!-- Lens Accent Brackets -->
    <path d="M 180 190 L 170 197.5 L 180 205" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 320 190 L 330 197.5 L 320 205" stroke="#38bdf8" stroke-width="3"/>

    <!-- Minimal Nose -->
    <path d="M 245 235 Q 250 245 255 235" stroke="#94a3b8" stroke-width="3"/>

    <!-- Minimal Beard Outline -->
    <path d="M 160 220 
             C 140 280, 150 360, 250 380 
             C 350 360, 360 280, 340 220" 
          stroke="#ffffff" stroke-width="6"/>

    <!-- Minimal Mustache -->
    <path d="M 250 255 C 220 245, 175 260, 170 270 M 250 255 C 280 245, 325 260, 330 270" stroke="#ffffff" stroke-width="4"/>

    <!-- Minimal Code Tag -->
    <text x="250" y="430" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" stroke="none">&lt;ELDER_VIBE /&gt;</text>
  </g>
</svg>
