<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 07: Cyberpunk - High contrast neon matrix rain, gritty aesthetic, glitch artifacts & visor -->
  <defs>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="30" fill="#05050a"/>

  <!-- Matrix Code Rain Backdrop -->
  <g opacity="0.2" fill="#39d353" font-family="monospace" font-size="10" font-weight="bold">
    <text x="30" y="40">01010101010101</text>
    <text x="30" y="70">SYSTEM_ERR: 0x99</text>
    <text x="30" y="100">CYBER_ELDER_VIBE</text>
    <text x="350" y="40">PIGGY_FARM_RUN</text>
    <text x="350" y="70">NEON_OVERDRIVE</text>
    <text x="350" y="100">0110011001101</text>
  </g>

  <!-- Glitch Color Shift Shadows -->
  <g transform="translate(-4, 0)" fill="#ff007f" opacity="0.7">
    <circle cx="250" cy="110" r="45"/>
    <rect x="140" y="170" width="220" height="50" rx="6"/>
  </g>
  <g transform="translate(4, 0)" fill="#00f2fe" opacity="0.7">
    <circle cx="250" cy="110" r="45"/>
    <rect x="140" y="170" width="220" height="50" rx="6"/>
  </g>

  <!-- Main Cyberpunk Character -->
  <g transform="translate(0, 10)">
    <!-- White Curled Cyber Hair -->
    <g fill="#ffffff">
      <circle cx="160" cy="140" r="38"/>
      <circle cx="205" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="295" cy="110" r="42"/>
      <circle cx="340" cy="140" r="38"/>
    </g>

    <!-- Gritty Visor Glasses with Cyber Neon Border -->
    <rect x="140" y="170" width="220" height="55" rx="8" fill="#000000" stroke="#39d353" stroke-width="4"/>
    <line x1="140" y1="197" x2="360" y2="197" stroke="#ff007f" stroke-width="3"/>
    <text x="250" y="190" fill="#39d353" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">CYBERPUNK // VIBE</text>

    <!-- Cyber Beard Base -->
    <path d="M 150 235 C 130 320, 160 400, 250 410 C 340 400, 370 320, 350 235 C 310 330, 190 330, 150 235 Z" 
          fill="#ffffff" stroke="#00f2fe" stroke-width="3"/>

    <!-- Cyber Circuit Beard Overlay Lines -->
    <path d="M 200 320 L 250 370 L 300 320" fill="none" stroke="#ff007f" stroke-width="3"/>
    <circle cx="200" cy="320" r="4" fill="#39d353"/>
    <circle cx="300" cy="320" r="4" fill="#39d353"/>
  </g>

  <!-- Tag -->
  <rect x="130" y="445" width="240" height="35" rx="6" fill="#ff007f"/>
  <text x="250" y="468" fill="#000" font-family="monospace" font-size="15" font-weight="900" text-anchor="middle">CYBERPUNK_ELDER_VIBE</text>
</svg>
