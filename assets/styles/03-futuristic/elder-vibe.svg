<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 03: Futuristic - Sci-fi HUD, quantum blue grids, holographic glow & cyber visor -->
  <defs>
    <linearGradient id="futGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="hudBlur">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="30" fill="#030712"/>

  <!-- Sci-Fi HUD Circle Target -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="20 10 5 10" opacity="0.6" filter="url(#hudBlur)"/>
  <circle cx="250" cy="250" r="180" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="100 20" opacity="0.4"/>

  <!-- Floating Holographic Circuit Nodes -->
  <path d="M 60 250 H 140 M 360 250 H 440 M 250 60 V 120" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="60" cy="250" r="4" fill="#00f2fe"/>
  <circle cx="440" cy="250" r="4" fill="#00f2fe"/>

  <g transform="translate(0, 10)">
    <!-- Holographic Quantum Hair -->
    <g fill="#e0f2fe" opacity="0.95" filter="url(#hudBlur)">
      <circle cx="170" cy="140" r="38"/>
      <circle cx="210" cy="110" r="42"/>
      <circle cx="250" cy="95" r="46"/>
      <circle cx="290" cy="110" r="42"/>
      <circle cx="330" cy="140" r="38"/>
    </g>

    <!-- Sci-Fi Visor HUD -->
    <path d="M 140 180 H 360 L 340 235 H 160 Z" fill="#0b1329" stroke="#00f2fe" stroke-width="3" filter="url(#hudBlur)"/>
    <line x1="150" y1="207" x2="350" y2="207" stroke="#38bdf8" stroke-width="3"/>
    <text x="250" y="200" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">QUANTUM_VIBE_V2.0</text>

    <!-- Glowing Cybernetic Beard -->
    <path d="M 150 230 C 130 320, 160 400, 250 410 C 340 400, 370 320, 350 230 C 310 330, 190 330, 150 230 Z" 
          fill="url(#futGlow)" opacity="0.8" stroke="#38bdf8" stroke-width="2" filter="url(#hudBlur)"/>

    <path d="M 200 320 L 250 370 L 300 320" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  </g>

  <text x="250" y="460" fill="#00f2fe" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3">FUTURE • ELDER VIBE</text>
</svg>
