<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Style 05: Collage Art - Mixed-media paper cutout texture, newsprint code overlay & torn shapes -->
  <defs>
    <pattern id="newspaperCode" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fef3c7"/>
      <text x="5" y="15" fill="#78350f" font-family="monospace" font-size="8" opacity="0.4">function vibe() {</text>
      <text x="5" y="30" fill="#78350f" font-family="monospace" font-size="8" opacity="0.4">return "paper_cut";</text>
      <text x="5" y="45" fill="#78350f" font-family="monospace" font-size="8" opacity="0.4">import { elder };</text>
      <text x="5" y="60" fill="#78350f" font-family="monospace" font-size="8" opacity="0.4">const age = 99;</text>
      <text x="5" y="75" fill="#78350f" font-family="monospace" font-size="8" opacity="0.4">yield(farm);</text>
      <text x="5" y="90" fill="#78350f" font-family="monospace" font-size="8" opacity="0.4">} // collage</text>
    </pattern>
  </defs>

  <rect width="500" height="500" rx="30" fill="#78350f"/>
  <rect x="20" y="20" width="460" height="460" rx="20" fill="url(#newspaperCode)"/>

  <!-- Torn Paper Collage Cutout Shapes -->
  <!-- Back Red Shape Cutout -->
  <polygon points="120,80 380,60 410,420 90,400" fill="#dc2626" transform="rotate(-3 250 250)"/>
  
  <g transform="translate(0, 15)">
    <!-- White Paper Cutout Curly Hair -->
    <polygon points="140,120 180,90 230,80 280,85 330,100 370,140 330,170 170,160" fill="#ffffff" stroke="#000" stroke-width="3"/>
    <circle cx="210" cy="110" r="30" fill="#fef3c7" stroke="#000" stroke-width="2"/>
    <circle cx="280" cy="110" r="30" fill="#fef3c7" stroke="#000" stroke-width="2"/>

    <!-- Cutout Skin Face -->
    <polygon points="160,170 340,165 330,270 250,290 170,270" fill="#fde68a" stroke="#000" stroke-width="3"/>

    <!-- Cutout Magazine Glasses -->
    <polygon points="140,180 360,175 350,230 150,235" fill="#0284c7" stroke="#000" stroke-width="4"/>
    <rect x="170" y="190" width="70" height="30" fill="#000"/>
    <rect x="260" y="190" width="70" height="30" fill="#000"/>
    <text x="180" y="210" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">CODE</text>
    <text x="270" y="210" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">VIBE</text>

    <!-- Torn Beard Cutout -->
    <polygon points="150,240 350,235 340,340 300,390 250,410 200,390 160,340" fill="#ffffff" stroke="#000" stroke-width="4"/>
    <path d="M 180 280 L 220 330 L 280 330 L 320 280" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 4"/>
  </g>

  <!-- Paper Label Ribbon -->
  <polygon points="100,430 400,420 390,460 110,470" fill="#000"/>
  <text x="250" y="452" fill="#fff" font-family="Courier, monospace" font-size="16" font-weight="bold" text-anchor="middle">COLLAGE • ELDER VIBE</text>
</svg>
