<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a0b2e" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="beardShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdbac" />
      <stop offset="100%" stop-color="#f1c27d" />
    </linearGradient>

    <linearGradient id="kbdGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="33%" stop-color="#39d353" />
      <stop offset="66%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="6" filter="url(#glow)" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Code Matrix Background Grid -->
  <g opacity="0.12" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">
    <text x="50" y="100">const vibe = "elder";</text>
    <text x="50" y="130">async function code() {</text>
    <text x="70" y="160">await ai.magic();</text>
    <text x="50" y="190">}</text>
    <text x="320" y="100">import { farm }</text>
    <text x="320" y="130">from 'piggy';</text>
    <text x="310" y="160">eldervibe.dev</text>
    <text x="340" y="190">vibeCoder = true;</text>
  </g>

  <!-- Background Accent Elements -->
  <circle cx="90" cy="210" r="4" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="410" cy="180" r="5" fill="#ff007f" filter="url(#glow)"/>
  <circle cx="390" cy="290" r="3" fill="#39d353" filter="url(#glow)"/>

  <!-- Character Group -->
  <g id="character" transform="translate(0, 10)">

    <!-- Hoodie Shoulders & Chest -->
    <path d="M 100 460 C 100 370, 140 330, 250 330 C 360 330, 400 370, 400 460 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="3" />
    <!-- Hoodie String & Zipper -->
    <path d="M 250 330 L 250 450" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <path d="M 210 340 C 210 380, 220 400, 225 410" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 290 340 C 290 380, 280 400, 275 410" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Hoodie Badge -->
    <rect x="180" y="380" width="140" height="34" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="250" y="402" fill="#00f2fe" font-family="'Courier New', monospace" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1.5">ELDER VIBE</text>

    <!-- Headphones Band (behind hair) -->
    <path d="M 130 200 C 130 90, 370 90, 370 200" fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round"/>
    <path d="M 130 200 C 130 90, 370 90, 370 200" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Curly White Hair (Back & Top Layer) -->
    <!-- Top & Side Curls -->
    <g fill="url(#hairGrad)" filter="url(#softShadow)">
      <circle cx="160" cy="150" r="38" />
      <circle cx="200" cy="120" r="42" />
      <circle cx="250" cy="105" r="46" />
      <circle cx="300" cy="120" r="42" />
      <circle cx="340" cy="150" r="38" />
      
      <!-- Upper Inner Curls -->
      <circle cx="180" cy="170" r="30" />
      <circle cx="320" cy="170" r="30" />
      <circle cx="220" cy="140" r="35" />
      <circle cx="280" cy="140" r="35" />
      <circle cx="250" cy="130" r="36" />

      <!-- Curly Details (Stylized swirls) -->
      <path d="M 190 115 C 205 105, 220 120, 210 130" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <path d="M 240 100 C 255 90, 270 105, 260 115" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <path d="M 290 110 C 305 100, 320 115, 310 125" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Headphones Cups -->
    <rect x="110" y="180" width="30" height="65" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
    <rect x="360" y="180" width="30" height="65" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
    <circle cx="125" cy="212" r="10" fill="#9d4edd"/>
    <circle cx="375" cy="212" r="10" fill="#9d4edd"/>

    <!-- Face Base -->
    <path d="M 160 190 C 160 290, 340 290, 340 190 Z" fill="url(#skinGrad)" />

    <!-- Ears -->
    <circle cx="150" cy="215" r="16" fill="#f1c27d"/>
    <circle cx="350" cy="215" r="16" fill="#f1c27d"/>

    <!-- Eyebrows (White Bushy) -->
    <path d="M 175 185 Q 200 170 225 185" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M 275 185 Q 300 170 325 185" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

    <!-- Vibe Glasses / Sunglasses (Cyber Shades) -->
    <g filter="url(#softShadow)">
      <!-- Frame -->
      <path d="M 155 190 Q 250 185 345 190 L 340 240 Q 250 255 160 240 Z" fill="#090d16" stroke="#00f2fe" stroke-width="4"/>
      <!-- Lenses with Gradient & Code Overlay -->
      <path d="M 165 196 L 240 196 L 235 236 Q 200 245 170 236 Z" fill="url(#glassesGrad)" opacity="0.9"/>
      <path d="M 260 196 L 335 196 L 330 236 Q 300 245 265 236 Z" fill="url(#glassesGrad)" opacity="0.9"/>
      <!-- Reflection Highlights -->
      <polygon points="170,198 210,198 185,232 170,232" fill="#ffffff" opacity="0.3"/>
      <polygon points="265,198 305,198 280,232 265,232" fill="#ffffff" opacity="0.3"/>
      <!-- Lens Code Matrix Lines -->
      <text x="175" y="215" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" opacity="0.75">&lt;/&gt; 010</text>
      <text x="175" y="227" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" opacity="0.75">VIBE_ON</text>
      <text x="270" y="215" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" opacity="0.75">DEV 101</text>
      <text x="270" y="227" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" opacity="0.75">PIGGY_FARM</text>
      <!-- Glasses Bridge -->
      <rect x="238" y="198" width="24" height="6" rx="3" fill="#00f2fe"/>
    </g>

    <!-- Nose -->
    <path d="M 242 225 Q 250 248 258 225" fill="none" stroke="#e09f67" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Mouth / Smile (Partially visible above beard) -->
    <path d="M 225 260 Q 250 275 275 260" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Big Full White Curled Beard & Mustache -->
    <g fill="url(#beardShadow)" filter="url(#softShadow)">
      <!-- Mustache -->
      <path d="M 250 255 C 220 245, 170 255, 160 275 C 190 285, 230 280, 250 268 C 270 280, 310 285, 340 275 C 330 255, 280 245, 250 255 Z"/>
      
      <!-- Main Beard Shape -->
      <path d="M 155 250 
               C 130 280, 135 340, 175 370 
               C 200 390, 225 410, 250 410 
               C 275 410, 300 390, 325 370 
               C 365 340, 370 280, 345 250 
               C 335 290, 315 320, 250 325 
               C 185 320, 165 290, 155 250 Z" />

      <!-- Beard Curly Swirl Details -->
      <path d="M 190 330 C 175 350, 200 375, 215 355" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <path d="M 310 330 C 325 350, 300 375, 285 355" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
      <path d="M 235 365 C 245 385, 260 385, 265 365" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Glowing Cyber Keyboard at Bottom -->
    <g transform="translate(100, 420)">
      <rect x="0" y="0" width="300" height="40" rx="8" fill="#0f172a" stroke="url(#kbdGlow)" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Key rows -->
      <line x1="20" y1="12" x2="280" y2="12" stroke="#334155" stroke-width="5" stroke-dasharray="12 4"/>
      <line x1="30" y1="22" x2="270" y2="22" stroke="#334155" stroke-width="5" stroke-dasharray="14 4"/>
      <rect x="90" y="28" width="120" height="6" rx="3" fill="#00f2fe" opacity="0.8"/>
    </g>

    <!-- Hands on Keyboard -->
    <!-- Left Hand -->
    <path d="M 120 440 C 135 415, 160 415, 175 435" fill="url(#skinGrad)" stroke="#d97706" stroke-width="1.5"/>
    <!-- Right Hand -->
    <path d="M 325 435 C 340 415, 365 415, 380 440" fill="url(#skinGrad)" stroke="#d97706" stroke-width="1.5"/>

  </g>
</svg>
