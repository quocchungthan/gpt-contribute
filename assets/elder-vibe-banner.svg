<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="banBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <filter id="banGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#banBg)" />
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="url(#textGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Code Matrix Background Lines -->
  <g opacity="0.08" fill="#00f2fe" font-family="monospace" font-size="14">
    <text x="600" y="100">const developer = new ElderVibeCoder({ age: "wise", vibe: "100%" });</text>
    <text x="600" y="130">await developer.shipToProduction();</text>
    <text x="600" y="160">// Linked Repo: github.com/quocchungthan/piggy-farm</text>
    <text x="600" y="190">function vibeCoding() { return pure_magic; }</text>
  </g>

  <!-- Glowing Grid Accent -->
  <path d="M 0 315 H 1200 M 600 0 V 630" stroke="#a855f7" stroke-width="1" stroke-opacity="0.1" />

  <!-- Left Side: Character Mascot Embedded (400x400 scale) -->
  <g transform="translate(60, 65)">
    <!-- Outer Glow Circle -->
    <circle cx="250" cy="250" r="230" fill="#0f172a" stroke="url(#textGrad)" stroke-width="5" filter="url(#banGlow)"/>
    
    <!-- Hair -->
    <g fill="#ffffff">
      <circle cx="160" cy="150" r="38" />
      <circle cx="200" cy="120" r="42" />
      <circle cx="250" cy="105" r="46" />
      <circle cx="300" cy="120" r="42" />
      <circle cx="340" cy="150" r="38" />
      <circle cx="180" cy="170" r="30" />
      <circle cx="320" cy="170" r="30" />
    </g>

    <!-- Headphones -->
    <path d="M 130 200 C 130 90, 370 90, 370 200" fill="none" stroke="#1e293b" stroke-width="22"/>
    <path d="M 130 200 C 130 90, 370 90, 370 200" fill="none" stroke="#00f2fe" stroke-width="4" filter="url(#banGlow)"/>
    <rect x="110" y="180" width="30" height="65" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
    <rect x="360" y="180" width="30" height="65" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>

    <!-- Face -->
    <path d="M 160 190 C 160 290, 340 290, 340 190 Z" fill="#fed7aa" />

    <!-- Eyebrows -->
    <path d="M 175 185 Q 200 170 225 185" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M 275 185 Q 300 170 325 185" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

    <!-- Sunglasses -->
    <path d="M 155 190 Q 250 185 345 190 L 340 240 Q 250 255 160 240 Z" fill="#090d16" stroke="#00f2fe" stroke-width="4"/>
    <path d="M 165 196 L 240 196 L 235 236 Q 200 245 170 236 Z" fill="url(#textGrad)"/>
    <path d="M 260 196 L 335 196 L 330 236 Q 300 245 265 236 Z" fill="url(#textGrad)"/>
    <text x="175" y="220" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">&lt;VIBE&gt;</text>
    <text x="270" y="220" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">CODER</text>

    <!-- White Beard -->
    <path d="M 250 255 C 220 245, 170 255, 160 275 C 190 285, 230 280, 250 268 C 270 280, 310 285, 340 275 C 330 255, 280 245, 250 255 Z" fill="#ffffff"/>
    <path d="M 155 250 C 130 280, 135 340, 175 370 C 200 390, 225 410, 250 410 C 275 410, 300 390, 325 370 C 365 340, 370 280, 345 250 C 335 290, 315 320, 250 325 C 185 320, 165 290, 155 250 Z" fill="#ffffff" />
  </g>

  <!-- Right Side: Content & Typography -->
  <g transform="translate(580, 140)">
    
    <!-- Domain Tag Pill -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="110" y="23" fill="#00f2fe" font-family="'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle">🌐 eldervibe.dev</text>

    <!-- Repo Tag Pill -->
    <rect x="235" y="0" width="310" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="390" y="23" fill="#a855f7" font-family="'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle">📦 quocchungthan/piggy-farm</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="url(#textGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" filter="url(#banGlow)">ELDER VIBE</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">Old enough to know better • Young enough to vibe code</text>

    <!-- Divider Line -->
    <line x1="0" y1="210" x2="540" y2="210" stroke="url(#subGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Feature Badges -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
      <text x="82.5" y="26" fill="#00f2fe" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">👨‍🦳 White Curled Beard</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="262.5" y="26" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚡ Pure Vibe Coding</text>

      <!-- Badge 3 -->
      <rect x="360" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
      <text x="442.5" y="26" fill="#f472b6" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🐷 Piggy Farm Ready</text>
    </g>

    <!-- Code Line Preview Box -->
    <rect x="0" y="305" width="525" height="45" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="20" y="332" fill="#39d353" font-family="monospace" font-size="14" font-weight="bold">$ git clone https://github.com/quocchungthan/piggy-farm</text>

  </g>
</svg>
