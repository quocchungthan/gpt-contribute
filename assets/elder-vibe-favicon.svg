<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#favCyan)" stroke-width="2"/>

  <!-- Curly White Hair Top -->
  <path d="M 16 24 C 14 16, 22 10, 32 10 C 42 10, 50 16, 48 24 Z" fill="#ffffff"/>
  <circle cx="22" cy="16" r="6" fill="#ffffff"/>
  <circle cx="32" cy="14" r="7" fill="#ffffff"/>
  <circle cx="42" cy="16" r="6" fill="#ffffff"/>

  <!-- Neon Glasses / Sunglasses -->
  <rect x="15" y="22" width="34" height="12" rx="3" fill="#090d16" stroke="#00f2fe" stroke-width="2"/>
  <!-- Lenses glow -->
  <rect x="18" y="24" width="12" height="8" rx="1" fill="#00f2fe"/>
  <rect x="34" y="24" width="12" height="8" rx="1" fill="#9d4edd"/>

  <!-- Full White Curled Beard Base -->
  <path d="M 16 32 C 12 44, 20 54, 32 56 C 44 54, 52 44, 48 32 C 42 38, 38 42, 32 42 C 26 42, 22 38, 16 32 Z" fill="#ffffff"/>

  <!-- Beard Detail Code Bracket -->
  <path d="M 28 46 L 25 49 L 28 52" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 36 46 L 39 49 L 36 52" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
