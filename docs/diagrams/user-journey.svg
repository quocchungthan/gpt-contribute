<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Listener MVP user journey</title>
  <desc id="desc">Seven connected vertical slices from onboarding to pilot-ready operation.</desc>
  <defs>
    <style>
      .bg{fill:#f6f7fb}.card{fill:#fff;stroke:#27324a;stroke-width:2}.head{fill:#27324a}.title{font:700 20px system-ui;fill:#fff}.label{font:700 17px system-ui;fill:#182033}.body{font:14px system-ui;fill:#45506a}.arrow{stroke:#67728b;stroke-width:3;fill:none;marker-end:url(#m)}.optional{stroke-dasharray:8 6}.tag{fill:#e6efff;stroke:#7b9ddd}.tagtext{font:700 12px system-ui;fill:#294d8f}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67728b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="720"/>
  <rect class="head" x="30" y="25" width="1440" height="64" rx="12"/>
  <text class="title" x="55" y="65">Listener MVP — outcome-driven vertical slices</text>
  <path class="arrow" d="M220 235 H250"/><path class="arrow" d="M440 235 H470"/><path class="arrow" d="M660 235 H690"/><path class="arrow" d="M880 235 H910"/>
  <rect class="card" x="30" y="130" width="190" height="210" rx="12"/><text class="label" x="50" y="165">S0 · Start safely</text><text class="body" x="50" y="200"><tspan x="50">Vietnamese onboarding</tspan><tspan x="50" dy="25">Choose microphone</tspan><tspan x="50" dy="25">Test → play → delete</tspan><tspan x="50" dy="25">Monitoring block</tspan></text><rect class="tag" x="50" y="292" width="112" height="25" rx="12"/><text class="tagtext" x="64" y="309">US-001, 002</text>
  <rect class="card" x="250" y="130" width="190" height="210" rx="12"/><text class="label" x="270" y="165">S1 · Run visibly</text><text class="body" x="270" y="200"><tspan x="270">Explicit launch/start</tspan><tspan x="270" dy="25">Tray always visible</tspan><tspan x="270" dy="25">Pause / Resume</tspan><tspan x="270" dy="25">Browser may close</tspan></text><rect class="tag" x="270" y="292" width="105" height="25" rx="12"/><text class="tagtext" x="284" y="309">US-003, 010</text>
  <rect class="card" x="470" y="130" width="190" height="210" rx="12"/><text class="label" x="490" y="165">S2 · Keep speech</text><text class="body" x="490" y="200"><tspan x="490">Automatic whispers</tspan><tspan x="490" dy="25">Pre/post-roll chunks</tspan><tspan x="490" dy="25">Discard silence</tspan><tspan x="490" dy="25">Bounded memory</tspan></text><rect class="tag" x="490" y="292" width="105" height="25" rx="12"/><text class="tagtext" x="504" y="309">US-004, 010</text>
  <rect class="card" x="690" y="130" width="190" height="210" rx="12"/><text class="label" x="710" y="165">S3 · Review</text><text class="body" x="710" y="200"><tspan x="710">Encrypted library</tspan><tspan x="710" dy="25">Play, title, tag</tspan><tspan x="710" dy="25">Sort by signal</tspan><tspan x="710" dy="25">Protect important</tspan></text><rect class="tag" x="710" y="292" width="135" height="25" rx="12"/><text class="tagtext" x="722" y="309">US-005, 006, 017</text>
  <rect class="card" x="910" y="130" width="190" height="210" rx="12"/><text class="label" x="930" y="165">S4 · Bound data</text><text class="body" x="930" y="200"><tspan x="930">7-day cleanup</tspan><tspan x="930" dy="25">5 GiB hard stop</tspan><tspan x="930" dy="25">80% toast warning</tspan><tspan x="930" dy="25">Protected-safe delete</tspan></text><rect class="tag" x="930" y="292" width="135" height="25" rx="12"/><text class="tagtext" x="942" y="309">US-007, 008, 010</text>
  <path class="arrow" d="M1100 235 H1130"/><rect class="card" x="1130" y="130" width="160" height="210" rx="12"/><text class="label" x="1150" y="165">S5 · Export</text><text class="body" x="1150" y="200"><tspan x="1150">Explicit selection</tspan><tspan x="1150" dy="25">Audio + metadata</tspan><tspan x="1150" dy="25">SHA-256 manifest</tspan><tspan x="1150" dy="25">No auto-share</tspan></text><rect class="tag" x="1150" y="292" width="72" height="25" rx="12"/><text class="tagtext" x="1164" y="309">US-009</text>
  <path class="arrow" d="M1290 235 H1320"/><rect class="card" x="1320" y="130" width="150" height="210" rx="12"/><text class="label" x="1340" y="165">S6 · Trust</text><text class="body" x="1340" y="200"><tspan x="1340">Recovery</tspan><tspan x="1340" dy="25">Sleep / reconnect</tspan><tspan x="1340" dy="25">Truthful status</tspan><tspan x="1340" dy="25">Safe diagnostics</tspan></text><rect class="tag" x="1340" y="292" width="72" height="25" rx="12"/><text class="tagtext" x="1354" y="309">US-010</text>
  <rect class="card" x="250" y="420" width="1000" height="220" rx="12"/><text class="label" x="280" y="458">Cross-cutting definition of done</text><text class="body" x="280" y="495"><tspan x="280">Every feature: truthful plain-language Monitoring block · freshness and stale state · last success/failure · useful measurements</tspan><tspan x="280" dy="32">Every workflow: human path + automated equivalent · authoritative durable-state check · structured redacted events · shared operation ID</tspan><tspan x="280" dy="32">AI maintenance: protected technical JSON + bounded operational DB records + Windows Event Log; no recording content in diagnostics</tspan><tspan x="280" dy="32">Safety: selected microphone only · visible tray · no semantic importance scoring · no automatic signal-based deletion</tspan></text>
</svg>
